<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercises - MindSpace App</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/exercises.css') }}">
</head>
<body class="exercise-page">

    <!-- Header -->
    <header class="navbar">
        <div class="logo" onclick="location.href='{{ url_for('home') }}'">MindSpace</div>
        <nav>
            <a href="{{ url_for('home') }}">Home</a>
            <a href="{{ url_for('menu') }}">Menu</a>
            <a href="{{ url_for('moodtracker') }}">Mood Tracker</a>
            <a href="{{ url_for('selfcare') }}">Selfcare</a>
            <a href="{{ url_for('exercises') }}">Exercises</a>
            <a href="{{ url_for('quotes') }}">Quotes</a>
        </nav>
    </header>

    <!-- Exercises Container -->
    <div class="exercises-wrapper">
        <h1>Daily Exercises</h1>
        <div class="exercise-cards">

            <div class="exercise-card">
                <h2>Deep Breathing</h2>
                <p>Take 5 minutes to breathe deeply and relax.</p>
                <button class="done-btn">Done</button>
            </div>

            <div class="exercise-card">
                <h2>Mindful Walk</h2>
                <p>Take a 10-minute walk and focus on the surroundings.</p>
                <button class="done-btn">Done</button>
            </div>

            <div class="exercise-card">
                <h2>Stretching</h2>
                <p>Stretch your arms, legs, and back for 5 minutes.</p>
                <button class="done-btn">Done</button>
            </div>

            <!-- Add more cards as needed -->
        </div>
    </div>

    <!-- Footer -->
    <footer>
        Created by Mehwish
    </footer>

    <script>
        const doneButtons = document.querySelectorAll('.done-btn');

        doneButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                btn.innerText = '✔ Completed';
                btn.disabled = true;
                btn.style.background = '#FF6EC7';
                // Optional: Add confetti effect here if desired
            });
        });
    </script>

</body>
</html>
